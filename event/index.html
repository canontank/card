<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>이벤트</title>

        <script src="config.js"></script>
        <script src="app.js"></script>
        <link rel="stylesheet" href="style.css">

    </head>
    <body>
        <!-- 콤보 박스 및 파일명 표시 영역 -->
        <div class="controls">
            <div class="nav-wrapper">
                <button id="prev-btn" class="nav-btn" title="이전 이미지">&#10094;</button>
                <select id="image-select"></select>
                <button id="next-btn" class="nav-btn" title="다음 이미지">&#10095;</button>
            </div>
        </div>

        <!-- 이미지 영역 -->
        <div class="viewer-container">
            <div class="image-wrapper" id="image-wrapper">
                <img id="current-image" src="" alt="현재 표시된 이미지">
            </div>
        </div>
    </body>
</html>
